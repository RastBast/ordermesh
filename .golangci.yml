run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gocritic
    - goimports
    - misspell
    - revive
    - unconvert
    - unparam
    - whitespace
    - nolintlint

linters-settings:
  goimports:
    local-prefixes: github.com/RastBast/ordermesh-
  errorlint:
    asserts: true
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
  max-issues-per-linter: 0
  max-same-issues: 0
