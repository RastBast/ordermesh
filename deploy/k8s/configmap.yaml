apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: orders
data:
  APP_ENV: "prod"
  LOG_LEVEL: "info"
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  REDIS_ADDR: "redis-master.orders.svc.cluster.local:6379"
  REDIS_TTL: "10m"
  KAFKA_BROKERS: "kafka-bootstrap.orders.svc.cluster.local:9092"
  KAFKA_TOPIC: "orders.events"
  KAFKA_CLIENT_ID: "order-service"
  OUTBOX_POLL_INTERVAL: "2s"
  OUTBOX_BATCH_SIZE: "200"
  OTEL_SERVICE_NAME: "order-service"
  OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  TRACE_SAMPLE_RATIO: "0.1"
  # Security (Zero Trust)
  AUTH_ENABLED: "true"
  JWKS_URL: "https://idp.example.com/.well-known/jwks.json"
  JWT_ISSUER: "https://idp.example.com"
  JWT_AUDIENCE: "order-service"
  RATE_LIMIT_RPS: "50"
  RATE_LIMIT_BURST: "100"
  IDEMPOTENCY_TTL: "24h"
