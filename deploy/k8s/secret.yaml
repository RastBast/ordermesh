# NOTE: This is an EXAMPLE secret. In production, manage secrets with an
# external store (Sealed Secrets, External Secrets Operator, Vault) and never
# commit real credentials. Values are plain stringData for readability.
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
  namespace: orders
type: Opaque
stringData:
  POSTGRES_DSN: "postgres://order:CHANGE_ME@postgres.orders.svc.cluster.local:5432/orders?sslmode=require"
  REDIS_PASSWORD: "CHANGE_ME"
  # Comma-separated base64 32-byte keys, oldest->newest. Generate with:
  #   openssl rand -base64 32
  PII_ENCRYPTION_KEYS: "CHANGE_ME_BASE64_32_BYTES"
